name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python tests/deep_security_test.py
      - run: python -m compileall -q src
      - run: python -m pip wheel --no-deps --no-build-isolation -w dist .

  mcp-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test,mcp]"
      - run: python -m pytest -q tests/test_mcp_sdk_runtime.py
