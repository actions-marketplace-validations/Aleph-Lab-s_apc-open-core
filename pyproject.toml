[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apc-action-security"
version = "0.1.0a1"
description = "Open-source action-security continuity and finality evaluation runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Aleph Labs"}]
keywords = ["agent-security", "action-security", "mcp", "authorization", "policy-enforcement", "audit-evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.13,<3",
  "cryptography>=42,<48",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10", "PyYAML>=6,<7"]
dev = [
  "pytest>=8,<10",
  "build>=1.2,<2",
  "twine>=6,<8",
  "ruff>=0.14,<1",
  "pip-audit>=2.9,<3",
]

[project.scripts]
apc = "apc_product.cli:main"
apc-mcp = "apc_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["apc", "apc.*", "apc_y", "apc_y.*", "apc_product", "apc_product.*", "apc_mcp", "apc_mcp.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
